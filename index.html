<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatDvits AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; font-family: sans-serif; }
        .chat-container { max-width: 900px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        .message-box { flex-grow: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .user-msg { background-color: #2563eb; color: white; padding: 12px 16px; border-radius: 18px 18px 0 18px; align-self: flex-end; max-width: 80%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .ai-msg { background-color: #1e293b; color: #f1f5f9; padding: 12px 16px; border-radius: 18px 18px 18px 0; align-self: flex-start; max-width: 80%; border: 1px solid #334155; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-200">

    <div class="chat-container">
        <header class="p-5 text-center border-b border-slate-800 bg-slate-900/50 backdrop-blur">
            <h1 class="text-3xl font-black tracking-tight text-blue-500">ChatDvits</h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Intelligent Companion</p>
        </header>

        <div id="chat-box" class="message-box flex flex-col space-y-6">
            <div class="ai-msg">Hello! I am ChatDvits. Your setup is complete. How can I help you today?</div>
        </div>

        <div class="p-6 bg-slate-900 border-t border-slate-800">
            <div class="flex gap-3 max-w-4xl mx-auto">
                <input id="user-input" type="text" placeholder="Type your message..." 
                    class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white">
                <button onclick="sendMsg()" class="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-xl font-bold shadow-lg shadow-blue-900/20 transition-all">Send</button>
            </div>
        </div>
    </div>

    <script>
        // STEP: PASTE YOUR GSK_ KEY BETWEEN THE QUOTES BELOW
        const MY_GROQ_KEY = "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"; 

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'ai-msg';
            loadingDiv.innerText = 'ChatDvits is thinking...';
            chatBox.appendChild(loadingDiv);

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${MY_GROQ_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: "You are ChatDvits — a friendly, intelligent companion." },
                            { role: "user", content: text }
                        ]
                    })
                });
                
                const data = await response.json();
                loadingDiv.remove();
                const aiReply = data.choices[0].message.content;

                chatBox.innerHTML += `<div class="ai-msg">${aiReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                loadingDiv.innerText = "Error: Please check your API key!";
            }
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });
    </script>
</body>
</html>
