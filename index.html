<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatDvits AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; }
        .chat-container { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        .message-box { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .user-msg { background-color: #3b82f6; color: white; padding: 10px 15px; border-radius: 15px 15px 0 15px; align-self: flex-end; max-width: 80%; }
        .ai-msg { background-color: #1f2937; color: #e5e7eb; padding: 10px 15px; border-radius: 15px 15px 15px 0; align-self: flex-start; max-width: 80%; }
    </style>
</head>
<body class="text-white">

    <div class="chat-container">
        <!-- Header -->
        <header class="p-6 text-center border-b border-gray-700">
            <h1 class="text-2xl font-bold text-blue-400">ChatDvits</h1>
            <p class="text-xs text-gray-500">Powered by Free AI</p>
        </header>

        <!-- Messages Area -->
        <div id="chat-box" class="message-box flex flex-col space-y-4">
            <div class="ai-msg shadow-lg">Hello! I am ChatDvits. I am now live on your GitHub! How can I help you today?</div>
        </div>

        <!-- Input Bar -->
        <div class="p-4 bg-gray-900 border-t border-gray-800">
            <div class="flex gap-2 max-w-4xl mx-auto">
                <input id="user-input" type="text" placeholder="Send a message..." 
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500">
                <button onclick="sendMsg()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold transition">Send</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();
            
            if (!text) return;

            // Display User Message
            chatBox.innerHTML += `<div class="user-msg shadow-md">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Display Loading State
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'ai-msg text-gray-400';
            loadingDiv.innerText = 'ChatDvits is thinking...';
            chatBox.appendChild(loadingDiv);

            try {
                // Using a 100% Free API (No Key Required for small tests)
                const response = await fetch("https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: `User: ${text}\nAssistant:` })
                });
                
                const result = await response.json();
                loadingDiv.remove();

                let reply = "I'm sorry, I'm having trouble connecting right now.";
                if (result && result[0] && result[0].generated_text) {
                    reply = result[0].generated_text.split("Assistant:").pop().trim();
                }

                chatBox.innerHTML += `<div class="ai-msg shadow-lg">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                loadingDiv.innerText = "Error: The free AI server is busy. Try again in a moment!";
            }
        }

        // Allow "Enter" key to send
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
