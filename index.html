<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatDvits AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e11;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #chat-container {
            width: 90%;
            max-width: 600px;
            background: #15191d;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 80vh;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background-color: #2c343a;
            color: #e0e0e0;
            border-bottom-left-radius: 2px;
        }

        #input-area {
            display: flex;
            padding: 15px;
            background: #1c2127;
            border-top: 1px solid #2c343a;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2c343a;
            color: white;
            outline: none;
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>ChatDvits AI</h1>

    <div id="chat-container">
        <div id="chat-box">
            <div class="message ai-msg">Hello! I am ChatDvits. How can I help you today?</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = input.value.trim();

            if (!userText) return;

            // 1. Display User Message
            chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Display Loading Indicator
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message ai-msg" id="${loadingId}">...thinking</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer 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"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [{ role: "user", content: userText }]
                    })
                });

                const data = await response.json();
                
                // Remove loading and show response
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiResponse = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="message ai-msg">${aiResponse}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai-msg">Error: Invalid response from API.</div>`;
                }

            } catch (error) {
                console.error("Error:", error);
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message ai-msg">Sorry, I couldn't connect to the server.</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
